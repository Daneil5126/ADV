<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Inventory Management Suite</title>
    <script defer src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface-muted: #f8fafc;
            --text: #263646;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #16a34a;
            --danger: #b91c1c;
            --sidebar: #172033;
            --sidebar-soft: #273449;
            --shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
            --radius: 8px;
            --landing-sst: 0.95;
            --landing-freight: 0.97;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        a:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.35);
            outline-offset: 2px;
        }

        .sidebar {
            width: 240px;
            position: fixed;
            inset: 0 auto 0 -240px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            background: var(--sidebar);
            color: white;
            transition: left 0.25s ease;
        }

        .sidebar.open {
            left: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 0 18px 20px;
            margin-bottom: 10px;
            border-bottom: 1px solid #314056;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .logo-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-hide-btn {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            border: 1px solid rgba(203, 213, 225, 0.35);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
